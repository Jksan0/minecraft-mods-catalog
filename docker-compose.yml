services:
  postgres:
    image: postgres:16
    container_name: minecraft-mods-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minecraft_mods
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minecraft_mods"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
